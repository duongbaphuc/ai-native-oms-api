services:
  postgres:
    image: postgres:15-alpine
    container_name: oms-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: workorderdb
      POSTGRES_USER: postgres
      # CAUTION: Password này chỉ dành cho mục đích Lab/Dev cục bộ, tuyệt đối không dùng trên Production!
      POSTGRES_PASSWORD: postgres_dev_only
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d workorderdb"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - oms-network

  oms-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: oms-api-service
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/workorderdb
      SPRING_DATASOURCE_USERNAME: postgres
      # CAUTION: Password này chỉ dành cho mục đích Lab/Dev cục bộ, tuyệt đối không dùng trên Production!
      SPRING_DATASOURCE_PASSWORD: postgres_dev_only
      SPRING_JPA_DATABASE_PLATFORM: org.hibernate.dialect.PostgreSQLDialect
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - oms-network

volumes:
  pgdata:
    driver: local

networks:
  oms-network:
    driver: bridge
